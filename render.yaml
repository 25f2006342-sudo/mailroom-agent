services:
  - type: web
    name: ga5-mailroom-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: mailroom-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/mailroom.sqlite3
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MAX_BODY_BYTES
        value: "2097152"
      - key: MODEL_MAX_OUTPUT_TOKENS
        value: "12000"
